services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: quinielas
      POSTGRES_PASSWORD: quinielas
      POSTGRES_DB: quinielas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quinielas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
